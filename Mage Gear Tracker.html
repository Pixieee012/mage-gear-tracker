<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mage Gear Tracker</title>
<style>
:root,:root[data-theme="dark"]{--bg:#121212;--pn:#1c1c1c;--ln:#4a3a10;--gold:#f2c230;--tx:#f2f2f2;--mu:#9a9a9a;--ok:#5ee27b;--Attack:#e5695c;--Balanced:#6fc27d;--Defense:#9a9a9a;--Expertise:#5b9be0;--Spread:#d8b35a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 "Segoe UI",Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
main{max-width:980px;margin:0 auto;padding:0 10px 40px}
h1{margin:0;padding:14px;text-align:center;color:var(--gold);font-size:26px;letter-spacing:2px;background:#1a1405;border:1px solid var(--ln)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:10px 0}
.card{background:var(--pn);border:1px solid var(--ln);padding:10px;text-align:center}
.card h2{margin:0 0 6px;font-size:11px;letter-spacing:1.5px;color:var(--gold)}
.big{font-size:34px;font-weight:700}.sm{color:var(--mu);font-size:12px}
.bar{height:8px;background:#2c2c2c;border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.st{display:grid;grid-template-columns:70px 1fr 64px;align-items:center;gap:6px;text-align:left;font-size:12px;margin:3px 0}.st .bar{margin:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
.tab{flex:0 0 auto;background:var(--pn);color:var(--tx);border:1px solid var(--ln);padding:7px 12px;cursor:pointer;font:inherit}
.tab small{display:block;color:var(--mu);font-size:11px}.tab.on{border-color:var(--gold);background:#2a2208;color:var(--gold)}
.fl{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.fl select,.fl input[type=search]{background:var(--pn);color:var(--tx);border:1px solid var(--ln);padding:7px;font:inherit;min-width:0;flex:1 1 120px}
.fl label{display:flex;align-items:center;gap:5px;color:var(--mu)}
.gh{margin:14px 0 4px;padding:6px 10px;background:#1a1405;border-left:3px solid var(--gold);color:var(--gold);font-weight:700}.gh span{color:var(--mu);font-weight:400;margin-left:8px}
.row{position:relative;display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:center;padding:9px 10px;border-bottom:1px solid #262626;background:var(--pn);margin-top:2px;transition:opacity .5s,background .5s}
.row.on{border-left:3px solid var(--ok)}.row.on .nm{color:var(--mu);text-decoration:line-through}
.nm{color:var(--gold);font-weight:700}.meta{color:var(--mu);font-size:12px;margin-top:1px}
.tg{display:inline-block;padding:0 6px;margin-right:6px;border-radius:3px;font-size:11px;font-weight:700;color:#111}
.chk{width:34px;height:34px;border:2px solid var(--gold);background:transparent;border-radius:8px;padding:0;cursor:pointer;position:relative}
.chk svg{width:100%;height:100%;fill:none;stroke:#111;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:26}
.chk.on{background:var(--gold)}.chk.on svg{stroke-dashoffset:0}
.chk.pop{animation:pop .45s}.chk.pop svg{animation:draw .35s .08s both}
.row.flash{animation:fl .9s}.row.out{opacity:0}
@keyframes draw{from{stroke-dashoffset:26}to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.35) rotate(-6deg)}100%{transform:scale(1)}}
@keyframes fl{0%{background:#6a5210;box-shadow:0 0 18px #f2c230}100%{background:var(--pn);box-shadow:none}}
.sp{position:absolute;left:21px;top:50%;width:7px;height:7px;border-radius:50%;background:var(--gold);pointer-events:none;animation:sp .7s ease-out forwards}
@keyframes sp{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--gold);color:#111;font-weight:700;padding:10px 18px;border-radius:20px;opacity:0;transition:.4s;z-index:40}
#toast.show{transform:translate(-50%,0);opacity:1}
.sv{color:var(--mu);font-size:11px;text-align:right;margin-top:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main>
